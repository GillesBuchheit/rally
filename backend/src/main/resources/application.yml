spring:
  application:
    name: rally-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DATABASE_USERNAME:postgres.suxvmmeppkxjwwkirahv}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MINIMUM_IDLE:0}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:10000}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DATABASE_SCHEMA:rally}
    schemas: ${DATABASE_SCHEMA:rally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:rally}
        jdbc:
          time_zone: UTC

server:
  port: 8080
