spring:
  datasource:
    url: jdbc:h2:mem:rally;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    create-schemas: true
    default-schema: rally
    schemas: rally
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rally
